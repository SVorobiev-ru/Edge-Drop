name: CI

on:
  push:
    branches:
      - main
      - macos-port
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !contains(fromJSON('["main","macos-port"]'), github.head_ref)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run typecheck
      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: npm run build:mac
      - name: Locate the built app
        if: runner.os == 'macOS'
        run: |
          case "$(uname -m)" in
            arm64) dir=dist/mac-arm64 ;;
            *) dir=dist/mac ;;
          esac
          echo "MAC_APP=${dir}/Edge-Drop.app" >> "$GITHUB_ENV"
      - name: Check the app.asar contents
        if: runner.os == 'macOS'
        run: node scripts/check-mac-asar.cjs "$MAC_APP"
      - name: Smoke-test the built binary
        if: runner.os == 'macOS'
        run: bash scripts/smoke-test-mac.sh "$MAC_APP"
